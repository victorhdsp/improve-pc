name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: probe

      - name: Build (Windows, release)
        working-directory: probe
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path probe/target/release/probe.exe -DestinationPath probe-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: probe-windows
          path: probe-x86_64-pc-windows-msvc.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" probe-x86_64-pc-windows-msvc.zip --title "$GITHUB_REF_NAME" --generate-notes
