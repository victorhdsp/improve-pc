[package]
name = "probe"
version = "0.5.0"
edition = "2021"

[dependencies]
chrono = "0.4"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
self_update = { version = "1.3", default-features = false, features = ["github", "archive-zip", "compression-zip-deflate", "ureq", "rustls"] }
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
ironmonitor = { version = "7.0", default-features = false, features = ["amd", "intel"] }
msr-driver-rs = "1.1"
serde = { version = "1", features = ["derive"] }
wmi = "0.18"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Power"] }

[target.'cfg(not(windows))'.dependencies]
ironmonitor = { version = "7.0", default-features = false, features = ["nvidia", "amd", "intel"] }

[profile.release]
strip = true
